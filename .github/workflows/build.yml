name: Build LLVM Pass

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install LLVM 14 and Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-14 llvm-14-dev clang-14 cmake

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake -DLLVM_DIR=/usr/lib/llvm-14/lib/cmake/llvm ..
        make

    - name: Test Fission Pass
      run: |
        # 1. Prevođenje C test primera u LLVM IR (.ll)
        clang-14 -S -emit-llvm -O0 -Xclang -disable-O0-optnone testForFission.c -o testForFission.ll

        # 2. Priprema IR-a sa mem2reg
        opt-14 -enable-new-pm=0 -mem2reg -S testForFission.ll -o test_prep.ll

        # 3. Pokretanje pasa
        opt-14 -enable-new-pm=0 -load build/LLVMOurLoopFissionPass.so -our-loop-fission -S test_prep.ll -o output_fission.ll

        # 4. Ispis rezultata
        cat output_fission.ll
